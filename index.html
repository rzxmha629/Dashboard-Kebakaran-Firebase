<!DOCTYPE html>
<html>
<head>
<title>Dashboard Kebakaran Firebase</title>
</head>
<body>

<h1>Dashboard Kebakaran Firebase</h1>

<p>Setup berhasil.</p>

<script type="module">

import { db } from "./firebase-config.js";

import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function loadLocations(){

const snapshot = await getDocs(
collection(db,"kebakaran")
);

console.log("DATA FIRESTORE:");
console.log(snapshot.docs);

}

loadLocations();

</script>

</body>
</html>
