<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PK3D LOGIN</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:
linear-gradient(
135deg,
#021126,
#042247,
#063b73
);
display:flex;
justify-content:center;
align-items:center;
}

.bg{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
}

.circle{
position:absolute;
border-radius:50%;
background:rgba(0,207,255,.08);
animation:float 10s infinite linear;
}

.circle:nth-child(1){
width:250px;
height:250px;
top:10%;
left:10%;
}

.circle:nth-child(2){
width:180px;
height:180px;
bottom:15%;
right:10%;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-30px)}
100%{transform:translateY(0)}
}

.container{
width:1100px;
max-width:95%;
display:flex;
align-items:center;
justify-content:space-between;
gap:40px;
z-index:2;
}

.character{
flex:1;
text-align:center;
}

.character img{
width:420px;
max-width:100%;
filter:
drop-shadow(0 0 30px #00cfff);
}

.login-box{
width:420px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.2);
border-radius:25px;
padding:35px;
box-shadow:
0 0 30px rgba(0,207,255,.25);
}

.login-box h1{
text-align:center;
margin-bottom:10px;
font-size:34px;
color:white;
}

.login-box p{
text-align:center;
color:#9ddfff;
margin-bottom:25px;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:6px;
color:white;
}

.input-group input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:rgba(255,255,255,.15);
color:white;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
font-size:16px;
background:#00cfff;
color:#00111f;
}

#status{
margin-top:15px;
text-align:center;
color:#ffbaba;
}

</style>
</head>

<body>

<div class="bg">
<div class="circle"></div>
<div class="circle"></div>
</div>

<div class="container">

<div class="character">

<img
src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png"
alt="PK3D">

</div>

<div class="login-box">

<h1>PK3D LOGIN</h1>

<p>Dashboard Monitoring Kebakaran</p>

<form id="loginForm">

<div class="input-group">
<label>Email</label>
<input type="email" id="email" placeholder="Masukkan Email">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" placeholder="Masukkan Password">
</div>

<button type="submit">
LOGIN
</button>

</form>

<div id="status"></div>

</div>

</div>

<script type="module">

import { auth } from "./firebase-config.js";

import {
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

gsap.from(".character",{
x:-300,
opacity:0,
duration:1.5
});

gsap.from(".login-box",{
x:300,
opacity:0,
duration:1.5
});

gsap.to(".character",{
y:-20,
duration:1.2,
repeat:-1,
yoyo:true
});

document
.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

e.preventDefault();

try{

document.getElementById("status")
.innerHTML=
"Memverifikasi Login...";

await signInWithEmailAndPassword(
auth,
document.getElementById("email").value,
document.getElementById("password").value
);

document.getElementById("status")
.innerHTML=
"Login Berhasil...";

setTimeout(()=>{

window.location.href=
"./dashboard.html";

},1000);

}catch(err){

document.getElementById("status")
.innerHTML=
err.message;

}

});

</script>

</body>
</html>
